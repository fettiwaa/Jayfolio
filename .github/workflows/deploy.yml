# Lint and build check on every push and pull request to main.
# Deployment is handled by Vercel (project fettiwaa/jayfolio, https://jayfolio-fty.vercel.app):
# run `vercel --prod`, or connect the GitHub repo in the Vercel dashboard for automatic deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
